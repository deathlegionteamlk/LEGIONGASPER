{% extends "base.html" %}

{% block title %}Canvas Visualization{% endblock %}

{% block extra_head %}
<style>
    .canvas-container {
        background: var(--bg-secondary);
        border: 1px solid var(--border-color);
        border-radius: var(--radius-lg);
        min-height: 600px;
        position: relative;
        overflow: hidden;
    }
    
    .canvas-svg {
        width: 100%;
        height: 600px;
    }
    
    .canvas-node {
        cursor: pointer;
        transition: all var(--transition-fast);
    }
    
    .canvas-node:hover rect {
        stroke: var(--accent-primary);
        stroke-width: 2;
    }
    
    .canvas-edge {
        stroke: var(--border-color);
        stroke-width: 2;
        fill: none;
    }
    
    .canvas-edge.active {
        stroke: var(--accent-primary);
        stroke-dasharray: 5;
        animation: dash 1s linear infinite;
    }
    
    @keyframes dash {
        to {
            stroke-dashoffset: -10;
        }
    }
    
    .canvas-controls {
        position: absolute;
        top: var(--space-md);
        right: var(--space-md);
        display: flex;
        gap: var(--space-sm);
    }
    
    .canvas-btn {
        padding: var(--space-sm);
        background: var(--bg-card);
        border: 1px solid var(--border-color);
        border-radius: var(--radius-sm);
        color: var(--text-primary);
        cursor: pointer;
    }
    
    .canvas-btn:hover {
        background: var(--bg-tertiary);
    }
</style>
{% endblock %}

{% block content %}
<div class="page-header">
    <h1>Canvas Visualization</h1>
    <p class="subtitle">Real-time Data Flow Visualization</p>
</div>

<div class="canvas-container" id="canvas-container">
    <div class="canvas-controls">
        <button class="canvas-btn" onclick="zoomIn()" title="Zoom In">
            <i data-lucide="zoom-in"></i>
        </button>
        <button class="canvas-btn" onclick="zoomOut()" title="Zoom Out">
            <i data-lucide="zoom-out"></i>
        </button>
        <button class="canvas-btn" onclick="resetView()" title="Reset">
            <i data-lucide="maximize"></i>
        </button>
        <button class="canvas-btn" onclick="toggleAnimation()" title="Play/Pause">
            <i data-lucide="play" id="play-icon"></i>
        </button>
    </div>
    
    <svg class="canvas-svg" id="canvas-svg" viewBox="0 0 1000 600">
        <defs>
            <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                <polygon points="0 0, 10 3, 0 6" fill="var(--border-color)" />
            </marker>
            <marker id="arrowhead-active" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                <polygon points="0 0, 10 3, 0 6" fill="var(--accent-primary)" />
            </marker>
        </defs>
        
        <!-- Edges -->
        <path class="canvas-edge" d="M 150 100 L 350 200" marker-end="url(#arrowhead)" />
        <path class="canvas-edge" d="M 450 200 L 650 100" marker-end="url(#arrowhead)" />
        <path class="canvas-edge" d="M 450 200 L 650 300" marker-end="url(#arrowhead)" />
        <path class="canvas-edge" d="M 750 100 L 900 200" marker-end="url(#arrowhead)" />
        <path class="canvas-edge" d="M 750 300 L 900 200" marker-end="url(#arrowhead)" />
        
        <!-- Nodes -->
        <g class="canvas-node" transform="translate(50, 50)">
            <rect width="100" height="100" rx="8" fill="var(--bg-card)" stroke="var(--border-color)" stroke-width="1" />
            <text x="50" y="40" text-anchor="middle" fill="var(--text-primary)" font-size="14">Input</text>
            <text x="50" y="60" text-anchor="middle" fill="var(--text-muted)" font-size="12">Data Source</text>
        </g>
        
        <g class="canvas-node" transform="translate(350, 150)">
            <rect width="100" height="100" rx="8" fill="var(--bg-card)" stroke="var(--accent-primary)" stroke-width="2" />
            <text x="50" y="40" text-anchor="middle" fill="var(--text-primary)" font-size="14">Agent 1</text>
            <text x="50" y="60" text-anchor="middle" fill="var(--text-muted)" font-size="12">Processing</text>
        </g>
        
        <g class="canvas-node" transform="translate(650, 50)">
            <rect width="100" height="100" rx="8" fill="var(--bg-card)" stroke="var(--border-color)" stroke-width="1" />
            <text x="50" y="40" text-anchor="middle" fill="var(--text-primary)" font-size="14">Agent 2</text>
            <text x="50" y="60" text-anchor="middle" fill="var(--text-muted)" font-size="12">Analysis</text>
        </g>
        
        <g class="canvas-node" transform="translate(650, 250)">
            <rect width="100" height="100" rx="8" fill="var(--bg-card)" stroke="var(--border-color)" stroke-width="1" />
            <text x="50" y="40" text-anchor="middle" fill="var(--text-primary)" font-size="14">Agent 3</text>
            <text x="50" y="60" text-anchor="middle" fill="var(--text-muted)" font-size="12">Transform</text>
        </g>
        
        <g class="canvas-node" transform="translate(900, 150)">
            <rect width="100" height="100" rx="8" fill="var(--bg-card)" stroke="var(--border-color)" stroke-width="1" />
            <text x="50" y="40" text-anchor="middle" fill="var(--text-primary)" font-size="14">Output</text>
            <text x="50" y="60" text-anchor="middle" fill="var(--text-muted)" font-size="12">Result</text>
        </g>
    </svg>
</div>

<div class="card" style="margin-top: var(--space-lg);">
    <div class="card-header">
        <i data-lucide="info"></i>
        <h3>Canvas Info</h3>
    </div>
    <div class="info-grid">
        <div class="info-item">
            <span class="info-label">Nodes</span>
            <span class="info-value">5</span>
        </div>
        <div class="info-item">
            <span class="info-label">Edges</span>
            <span class="info-value">5</span>
        </div>
        <div class="info-item">
            <span class="info-label">Active Flows</span>
            <span class="info-value">1</span>
        </div>
        <div class="info-item">
            <span class="info-label">Update Rate</span>
            <span class="info-value">60 FPS</span>
        </div>
    </div>
</div>

<style>
    .info-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: var(--space-lg);
    }
    
    .info-item {
        display: flex;
        flex-direction: column;
        gap: var(--space-xs);
    }
    
    .info-label {
        font-size: 0.8rem;
        color: var(--text-muted);
    }
    
    .info-value {
        font-size: 1.25rem;
        font-weight: 600;
        font-family: var(--font-mono);
    }
</style>

<script>
    let animationRunning = false;
    let zoom = 1;
    
    function zoomIn() {
        zoom *= 1.2;
        updateZoom();
    }
    
    function zoomOut() {
        zoom /= 1.2;
        updateZoom();
    }
    
    function resetView() {
        zoom = 1;
        updateZoom();
    }
    
    function updateZoom() {
        const svg = document.getElementById('canvas-svg');
        svg.style.transform = `scale(${zoom})`;
    }
    
    function toggleAnimation() {
        animationRunning = !animationRunning;
        const icon = document.getElementById('play-icon');
        icon.setAttribute('data-lucide', animationRunning ? 'pause' : 'play');
        lucide.createIcons();
        
        const edges = document.querySelectorAll('.canvas-edge');
        edges.forEach(edge => {
            edge.classList.toggle('active', animationRunning);
        });
    }
</script>
{% endblock %}
